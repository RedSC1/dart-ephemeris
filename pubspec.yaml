name: dart_ephemeris_workspace
description: Workspace for the Dart Ephemeris (Taiyin) packages.
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/ephemeris
  - packages/ephemeris_bazi
  - packages/ephemeris_ziwei

dev_dependencies:
  ephemeris:
    path: packages/ephemeris
  ephemeris_bazi:
    path: packages/ephemeris_bazi
  ephemeris_ziwei:
    path: packages/ephemeris_ziwei
  ffigen: ^20.1.1
