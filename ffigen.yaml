name: TaiyinBindings
description: Generated bindings for the Taiyin C ABI.
output: lib/src/bindings/taiyin_bindings.g.dart
headers:
  entry-points:
    - tool/taiyin_wrapper.h
compiler-opts:
  - -I../taiyin-ephemeris/include
functions:
  include:
    - taiyin_get_c_abi_version
    - taiyin_get_library_version
    - taiyin_get_capabilities
    - taiyin_status_name
    - taiyin_status_message
    - taiyin_calendar_datetime_init
    - taiyin_julian_day
    - taiyin_reverse_julian_day
    - taiyin_runtime_config_init
    - taiyin_runtime_initialize
    - taiyin_runtime_catalog_size
    - taiyin_context_create
    - taiyin_context_clone
    - taiyin_context_destroy
    - taiyin_calc_position_tt
    - taiyin_calc_position_ut
structs:
  include:
    - taiyin_calendar_datetime
    - taiyin_runtime_config
enums:
  as-int:
    include:
      - taiyin_.*
macros:
  exclude:
    - .*
preamble: |
  // coverage:ignore-file
  // ignore_for_file: type=lint
  // Generated by `dart run ffigen --config ffigen.yaml`. Do not edit.
