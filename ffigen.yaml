name: TaiyinBindings
description: Generated bindings for the Taiyin C ABI.
output: packages/taiyin/lib/src/bindings/taiyin_bindings.g.dart
headers:
  entry-points:
    - tool/taiyin_wrapper.h
compiler-opts:
  - -I../taiyin-ephemeris/include
  - -I../taiyin-ephemeris/bazi_astrology/include
  - -I../taiyin-ephemeris/ziwei_astrology/include
functions:
  rename:
    taiyin_status_category: taiyin_status_category_of
  include:
    - taiyin_.*
structs:
  include:
    - taiyin_.*
unions:
  include:
    - taiyin_.*
enums:
  as-int:
    include:
      - taiyin_.*
macros:
  exclude:
    - .*
preamble: |
  // coverage:ignore-file
  // ignore_for_file: type=lint
  // Generated by `dart run ffigen --config ffigen.yaml`. Do not edit.
